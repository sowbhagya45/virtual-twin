[project]
name = "virtual-twin"
version = "0.1.0"
description = "Agentic AI virtual twin — LangGraph + Gemini deep multi-agent system for Sowbhagya Mohanthy"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.28",
    "langgraph-supervisor>=0.0.5",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "pdfminer-six>=20221105",
    "google-generativeai>=0.8.0",
    "sendgrid>=6.11.0",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.0",
    "langsmith>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
